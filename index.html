<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#008566" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0D1311" media="(prefers-color-scheme: dark)" />
  <title>BenchMark Pro</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icons/icon-192-maskable.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600;700&display=swap" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <div class="brand">Bench<b>Mark</b> Pro</div>
      <span class="ver" id="appVersion"></span>
    </header>

    <main class="screens" id="screen" tabindex="-1"></main>

    <div class="sheet-bg" id="overlay" hidden></div>
    <!-- Außerhalb von #screen: Android meldet beim Zurückkommen aus der Dateiauswahl "sichtbar",
         die App rendert neu, und ein Feld innerhalb von #screen würde die Auswahl verlieren -->
    <input id="fileImport" type="file" accept=".json,application/json,*/*" hidden>

    <nav class="nav" id="nav" aria-label="Navigation">
      <button data-action="tab" data-tab="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 7.6 10.5" stroke-width="3"/></svg>Heute</button>
      <button data-action="tab" data-tab="history"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="3" y="3" width="5" height="5" rx="1"/><rect x="10" y="3" width="5" height="5" rx="1" opacity=".5"/><rect x="17" y="3" width="4" height="5" rx="1"/><rect x="3" y="10" width="5" height="5" rx="1" opacity=".5"/><rect x="10" y="10" width="5" height="5" rx="1"/><rect x="17" y="10" width="4" height="5" rx="1" opacity=".3"/><rect x="3" y="17" width="5" height="4" rx="1"/><rect x="10" y="17" width="5" height="4" rx="1" opacity=".3"/><rect x="17" y="17" width="4" height="4" rx="1" opacity=".6"/></svg>Verlauf</button>
      <button data-action="tab" data-tab="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 19l5-6 4 3 8-10"/><path d="M3 21h18"/></svg>Fortschritt</button>
      <button data-action="tab" data-tab="more"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>Mehr</button>
    </nav>
  </div>

  <script type="module" src="src/app.js"></script>
</body>
</html>
